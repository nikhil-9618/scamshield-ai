# Render Blueprint for ScamShield AI.
#
# Free-plan notes (see docs/render.md):
#  - Free web services spin down after 15 minutes idle and cannot receive private traffic,
#    so this Blueprint wires the web -> API and API -> AI calls through their public HTTPS URLs.
#  - Free Render Postgres expires 30 days after creation. Upgrade the database plan for persistence.
#  - Free web services have no shell; the API creates the first admin from the bootstrap env vars.
#
# Deploy: Render Dashboard -> New -> Blueprint -> select the repository containing this file.

envVarGroups:
  - name: scamshield-shared-secrets
    envVars:
      - key: APP_ENCRYPTION_KEY
        generateValue: true
      - key: INTERNAL_SERVICE_TOKEN
        generateValue: true

databases:
  - name: scamshield-db
    databaseName: scamshield
    user: scamshield
    plan: free
    region: oregon

services:
  - type: web
    name: scamshield-ai
    runtime: docker
    plan: free
    region: oregon
    dockerContext: ./apps/ai-engine
    # dockerfilePath is relative to the repo root, not dockerContext.
    dockerfilePath: ./apps/ai-engine/Dockerfile
    healthCheckPath: /health
    envVars:
      - fromGroup: scamshield-shared-secrets
      # Optional OpenAI-compatible explainer. Leave blank for labelled deterministic explanations.
      - key: LLM_API_KEY
        value: ""
      - key: LLM_BASE_URL
        value: ""
      - key: LLM_MODEL
        value: ""

  - type: web
    name: scamshield-api
    runtime: docker
    plan: free
    region: oregon
    dockerContext: .
    dockerfilePath: ./apps/api/Dockerfile
    healthCheckPath: /health
    envVars:
      - fromGroup: scamshield-shared-secrets
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: scamshield-db
          property: connectionString
      # Scans run inline on the free plan. Add a Render Key Value instance and
      # set REDIS_URL to enable BullMQ (see docs/render.md).
      # Free web services cannot receive private traffic, so use the public
      # HTTPS URLs Render assigns. envVarKey resolves after the first sync.
      - key: APP_ORIGIN
        fromService:
          type: web
          name: scamshield-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: scamshield-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: AI_ENGINE_URL
        fromService:
          type: web
          name: scamshield-ai
          envVarKey: RENDER_EXTERNAL_URL
      - key: AI_ENGINE_ENABLED
        value: "true"
      - key: AI_ENGINE_TIMEOUT_MS
        value: "20000"
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "1"
      - key: ENABLE_API_DOCS
        value: "false"
      - key: THREAT_INTEL_DEV_FIXTURES
        value: "false"
      - key: URLHAUS_ENABLED
        value: "true"
      - key: PHISHTANK_ENABLED
        value: "false"
      - key: EMAIL_ENABLED
        value: "false"
      - key: SEED_DEMO_DATA
        value: "false"
      - key: GOOGLE_SAFE_BROWSING_API_KEY
        value: ""
      - key: VIRUSTOTAL_API_KEY
        value: ""
      # One-time first-admin bootstrap. Enter a strong password when Render prompts.
      # Remove BOOTSTRAP_ADMIN_PASSWORD from the service after the first successful sign-in.
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false

  - type: web
    name: scamshield-web
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev --workspaces --include-workspace-root && npm run build:packages && npm run build --workspace @scamshield/web
    startCommand: node_modules/.bin/next start apps/web --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: API_INTERNAL_URL
        fromService:
          type: web
          name: scamshield-api
          envVarKey: RENDER_EXTERNAL_URL
